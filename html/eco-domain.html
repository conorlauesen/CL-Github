    <div class="image-carousel" id="imageCarousel">

        <button class="carousel-close" id="carouselClose">
            ×
        </button>
    
        <button class="carousel-prev" id="carouselPrev">
            ‹
        </button>
    
        <img class="carousel-image" id="carouselImage" src="" alt="">
    
        <button class="carousel-next" id="carouselNext">
            ›
        </button>
    
    </div>
    
    <script>
    
        const carousel = document.getElementById("imageCarousel");
        const carouselImage = document.getElementById("carouselImage");
        
        const nextButton = document.getElementById("carouselNext");
        const prevButton = document.getElementById("carouselPrev");
        const closeButton = document.getElementById("carouselClose");
        
        let currentGrid = [];
        let currentIndex = 0;
        
        
        /* ---------------------------------------------
           OPEN CAROUSEL
        --------------------------------------------- */
        
        function openCarousel(grid, index) {
        
            currentGrid = grid;
            currentIndex = index;
        
            showImage();
        
            carousel.classList.add("active");
        
            document.body.style.overflow = "hidden";
        }
        
        
        /* ---------------------------------------------
           SHOW CURRENT IMAGE
        --------------------------------------------- */
        
        function showImage() {
        
            const image = currentGrid[currentIndex];
        
            carouselImage.src = image.src;
            carouselImage.alt = image.alt;
        
        }
        
        
        /* ---------------------------------------------
           NEXT IMAGE
        --------------------------------------------- */
        
        function nextImage() {
        
            currentIndex++;
        
            if (currentIndex >= currentGrid.length) {
                currentIndex = 0;
            }
        
            showImage();
        
        }
        
        
        /* ---------------------------------------------
           PREVIOUS IMAGE
        --------------------------------------------- */
        
        function previousImage() {
        
            currentIndex--;
        
            if (currentIndex < 0) {
                currentIndex = currentGrid.length - 1;
            }
        
            showImage();
        
        }
        
        
        /* ---------------------------------------------
           CLOSE
        --------------------------------------------- */
        
        function closeCarousel() {
        
            carousel.classList.remove("active");
        
            document.body.style.overflow = "";
        
        }
        
        
        /* ---------------------------------------------
           GET EACH GRID SEPARATELY
        --------------------------------------------- */
        
        const grids = document.querySelectorAll(".archive-grid");
        
        
        grids.forEach(function(grid) {
        
            const images = grid.querySelectorAll("img");
        
            images.forEach(function(image, index) {
        
                image.addEventListener("click", function(event) {
        
                    event.preventDefault();
        
                    openCarousel(images, index);
        
                });
        
            });
        
        });
        
        
        /* ---------------------------------------------
           BUTTONS
        --------------------------------------------- */
        
        nextButton.addEventListener("click", nextImage);
        
        prevButton.addEventListener("click", previousImage);
        
        closeButton.addEventListener("click", closeCarousel);
        
        
        /* ---------------------------------------------
           CLICK OUTSIDE IMAGE TO CLOSE
        --------------------------------------------- */
        
        carousel.addEventListener("click", function(event) {
        
            if (event.target === carousel) {
        
                closeCarousel();
        
            }
        
        });
        
        
        /* ---------------------------------------------
           KEYBOARD
        --------------------------------------------- */
        
        document.addEventListener("keydown", function(event) {
        
            if (!carousel.classList.contains("active")) {
                return;
            }
        
            if (event.key === "ArrowRight") {
                nextImage();
            }
        
            if (event.key === "ArrowLeft") {
                previousImage();
            }
        
            if (event.key === "Escape") {
                closeCarousel();
            }
        
        });
        
        </script>
